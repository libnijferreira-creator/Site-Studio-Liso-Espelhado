# Studio Liso Espelhado — sobe o site com Docker
#
# Arquitetura:
#   usuário → Caddy (:80/:443, HTTPS automático Let's Encrypt)
#                 └─ reverse_proxy → Next.js (:3000, só rede interna)
#
# O Next NÃO publica porta direto — o Caddy fica na frente. Porta 3000 só
# é publicada em 127.0.0.1 para depuração pelo próprio servidor.
#
# SITE_URL aparece em DOIS lugares de propósito:
#   - build.args  → grava o endereço no HTML pré-renderizado (metadataBase)
#   - environment → é o valor lido em tempo de execução pelo /sitemap.xml e
#                   /robots.txt (rotas dinâmicas), ou seja, o que o Google lê
# (NEXT_PUBLIC_* seria embutido no bundle no build e não mudaria depois —
# por isso o sitemap/robots usam SITE_URL em runtime.)
services:
  studio:
    build:
      context: .
      args:
        SITE_URL: "https://studiolisoespelhado.com.br"
    image: studio-liso:latest
    container_name: studio-liso
    restart: unless-stopped
    ports:
      # só loopback — depuração: curl http://127.0.0.1:3000/ no servidor
      - "127.0.0.1:3000:3000"
    volumes:
      # banco SQLite e fotos — persistem fora do container
      - ./data:/app/data
      - ./uploads:/app/public/uploads
    environment:
      # Usado APENAS na primeira inicialização (criação do banco).
      ADMIN_USER: "admin"
      ADMIN_PASSWORD: "TROQUE-ESTA-SENHA"
      # Endereço público do site — leitura em runtime (sitemap/robots/MP).
      SITE_URL: "https://studiolisoespelhado.com.br"
      # Reserva: ainda é lida como fallback pelo siteBaseUrl().
      NEXT_PUBLIC_BASE_URL: "https://studiolisoespelhado.com.br"

  caddy:
    image: caddy:alpine
    container_name: caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - studio

volumes:
  caddy_data:
  caddy_config:
